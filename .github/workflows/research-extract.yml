name: Research extraction validation
on:
  pull_request:
    paths:
      - 'research/uiux-2026-10-08/**'
      - 'knowledge/domains/uiux/**'
      - 'learning/seeds/uiux-research-seeds.json'
      - 'learning/seeds/uiux-question-routing.v1.json'
      - 'scripts/gate-research-question.mjs'
      - 'worker/research-preview.js'
      - 'tests/research-preview.test.mjs'
      - 'public/research-preview.js'
      - 'scripts/validate-research-question-routing.mjs'
      - 'scripts/audit-research-holdout-eligibility.mjs'
      - 'scripts/validate-research-holdout-eligibility.mjs'
      - 'evaluations/examples/uiux-ia-public-example.json'
      - 'schemas/research-candidate.v1.schema.json'
      - 'scripts/validate-research-extract.mjs'
      - 'scripts/validate-conditional-candidates.mjs'
      - 'scripts/evaluate-conditional-candidates.mjs'
      - 'tests/fixtures/uiux-conditional-cases.v1.json'
      - '.github/workflows/research-extract.yml'
  push:
    branches: [main]
    paths:
      - 'research/uiux-2026-10-08/**'
      - 'knowledge/domains/uiux/**'
      - 'learning/seeds/uiux-research-seeds.json'
      - 'learning/seeds/uiux-question-routing.v1.json'
      - 'scripts/gate-research-question.mjs'
      - 'worker/research-preview.js'
      - 'tests/research-preview.test.mjs'
      - 'public/research-preview.js'
      - 'scripts/validate-research-question-routing.mjs'
      - 'scripts/audit-research-holdout-eligibility.mjs'
      - 'scripts/validate-research-holdout-eligibility.mjs'
      - 'evaluations/examples/uiux-ia-public-example.json'
      - 'schemas/research-candidate.v1.schema.json'
      - 'scripts/validate-research-extract.mjs'
      - 'scripts/validate-conditional-candidates.mjs'
      - 'scripts/evaluate-conditional-candidates.mjs'
      - 'tests/fixtures/uiux-conditional-cases.v1.json'
      - '.github/workflows/research-extract.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-derived research data
        run: node scripts/validate-research-extract.mjs
      - name: Validate conditional research candidates and 160 synthetic cases
        run: node scripts/validate-conditional-candidates.mjs
      - name: Validate research question routing and abstention
        run: node scripts/validate-research-question-routing.mjs
      - name: Audit research held-out eligibility without publishing personal data
        run: node scripts/validate-research-holdout-eligibility.mjs
