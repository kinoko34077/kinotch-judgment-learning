<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="KiNoTch. Judgment Learning の公開案内ページ。">
  <title>KiNoTch. Judgment Learning — 公開準備中</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
      line-height:1.75;background:#101923;color:#f2f4f7}
    main{width:min(100%,640px);padding:clamp(26px,7vw,56px);border:1px solid #405063;border-radius:20px;background:#182432}
    .eyebrow{margin:0 0 16px;font-size:.84rem;letter-spacing:.1em;color:#a5bbc9}
    h1{margin:0 0 16px;font-size:clamp(1.7rem,5vw,2.65rem);line-height:1.35;overflow-wrap:anywhere}
    p{margin:0 0 16px}
    .note{padding:16px;border:1px solid #405063;border-radius:12px;color:#d8e2e9;background:#223244}
    a{color:#b8e8ff;text-underline-offset:4px}
    a:focus-visible{outline:3px solid #fff;outline-offset:4px;border-radius:2px}
    footer{margin-top:24px;color:#abbccc;font-size:.88rem}
    @media(prefers-color-scheme:light){body{background:#eef3f7;color:#17202d}main{background:#fff;border-color:#d0dce5}
      .eyebrow,footer{color:#506474}.note{background:#eef4f8;border-color:#d0dce5;color:#233442}
      a{color:#005b90}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">KiNoTch. / JUDGMENT LEARNING</p>
    <h1>判断学習システム</h1>
    <p>一般知識を参照し、AIが判断候補を提示する仕組みを開発しています。個人の回答と、公開可能な研究資料を分離して管理します。</p>
    <p class="note" role="status">現在は公開案内ページのみです。GitHubログイン・回答保存・個人向け機能はまだ提供していません。</p>
    <p>開発状況は <a href="https://github.com/kinoko34077/kinotch-judgment-learning">公開リポジトリ</a> で確認できます。</p>
    <footer>このページは公開用の説明だけを含み、利用者の回答や認証情報を処理・保存しません。</footer>
  </main>
</body>
</html>
