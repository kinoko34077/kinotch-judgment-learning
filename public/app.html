<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>判断セッション · KiNoTch.</title>
<link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head><body>
<header><a href="/">KiNoTch. <span>Judgment Learning</span></a><button id="logout" type="button" class="headerbtn">ログアウト</button></header>
<main class="workspace"><p class="eyebrow">PRIVATE JUDGMENT SESSION</p><h1>判断を確認する</h1>
<p class="muted">AIが先に選んだ判断をGOか添削で確認。現在の初期設問は概念検証用のサンプルです。</p>
<div id="message" role="status" aria-live="polite">読み込み中…</div>
<label for="domain">学習分野</label><select id="domain" disabled><option>読込中</option></select>
<article class="question" id="question" hidden><p class="eyebrow" id="qid"></p><h2 id="prompt"></h2>
<div class="answer"><small>AIの初期回答</small><strong id="ai-answer"></strong><p id="ai-reason"></p></div>
<div class="muted options" id="options"></div><p class="muted" id="source"></p>
<div class="actions"><button class="button primary" id="go" type="button">✓ GO</button><button class="button secondary" id="edit" type="button">修正・補足</button><button class="button secondary" id="skip" type="button">保留</button></div>
<form id="correction" hidden><h3>差分の入力</h3><label for="answer">採用する案・別解（任意）</label><input id="answer" maxlength="1000" placeholder="別の選択肢や構造を指定">
<label for="note">修正内容・条件・例外（任意）</label><textarea id="note" rows="4" maxlength="3000" placeholder="違う部分だけ記入してください"></textarea>
<div class="actions"><button class="button primary" type="submit">修正を保存</button><button id="cancel" class="button secondary" type="button">キャンセル</button></div></form></article>
<section class="history"><div class="row"><h2>最近の回答</h2><button class="button secondary" type="button" id="refresh">更新</button></div><div id="history">回答なし</div></section>
<footer>回答は非公開の個人ストレージに保存されます。公開GitHubリポジトリには記録されません。</footer></main></body></html>
